name: Gem elprisprognose

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/archive-forecast.yml"
      - "scripts/archive-forecast.mjs"
  schedule:
    # GitHub planlaegger i UTC. Forsøg hvert kvarter fra 13-18 UTC.
    # Scriptet bruger Europe/Copenhagen som facit, starter først efter dansk kl. 15
    # og stopper efter dagens første vellykkede opdatering. Det virker i både
    # sommer- og vintertid og giver nye forsøg, hvis GitHub er forsinket.
    - cron: "7,22,37,52 13-18 * * *"

permissions:
  contents: write

concurrency:
  group: archive-elpris-forecast
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Hent projektet
        uses: actions/checkout@v5

      - name: Gem prognose og beregn traefsikkerhed
        run: node scripts/archive-forecast.mjs
        env:
          FORCE_RUN: ${{ github.event_name != 'schedule' }}

      - name: Gem opdaterede historikdata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast-log.json data/accuracy.json
          if git diff --cached --quiet; then
            echo "Ingen nye data at gemme."
          else
            git commit -m "Opdater prognosehistorik"
            git push
          fi
