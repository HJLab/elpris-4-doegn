name: Gem elprisprognose

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/archive-forecast.yml"
      - "scripts/archive-forecast.mjs"
  schedule:
    # Fast dansk tid. GitHub håndterer selv sommer-/vintertid.
    # 11:20 gemmer dagens prognose før de officielle priser.
    # 15:20 opdaterer historikken efter day-ahead-priserne normalt er ude.
    - cron: "20 11 * * *"
      timezone: "Europe/Copenhagen"
    - cron: "20 15 * * *"
      timezone: "Europe/Copenhagen"

permissions:
  contents: write

concurrency:
  group: archive-elpris-forecast
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hent projektet
        uses: actions/checkout@v5

      - name: Gem prognose og beregn traefsikkerhed
        run: node scripts/archive-forecast.mjs

      - name: Gem opdaterede historikdata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast-log.json data/accuracy.json
          if git diff --cached --quiet; then
            echo "Ingen nye data at gemme."
          else
            git commit -m "Opdater prognosehistorik"
            git pull --rebase
            git push
          fi
