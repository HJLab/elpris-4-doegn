name: Gem elprisprognose

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/archive-forecast.yml"
      - "scripts/archive-forecast.mjs"
  schedule:
    # GitHub kører cron i UTC. Vi prøver to gange i timen gennem en bred del af dagen.
    # Scriptet bruger Europe/Copenhagen som facit og gemmer kun ét snapshot pr. døgn.
    # Første snapshot må gemmes fra kl. 11 dansk tid, altså før day-ahead-priserne
    # normalt offentliggøres. Senere kørsler kan derfor sammenligne prognosen med
    # de officielle DayAheadPrices samme eftermiddag.
    - cron: "13,43 9-21 * * *"

permissions:
  contents: write

concurrency:
  group: archive-elpris-forecast
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Hent projektet
        uses: actions/checkout@v5

      - name: Gem prognose og beregn traefsikkerhed
        run: node scripts/archive-forecast.mjs
        env:
          FORCE_RUN: ${{ github.event_name != 'schedule' }}

      - name: Gem opdaterede historikdata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast-log.json data/accuracy.json
          if git diff --cached --quiet; then
            echo "Ingen nye data at gemme."
          else
            git commit -m "Opdater prognosehistorik"
            git pull --rebase
            git push
          fi
